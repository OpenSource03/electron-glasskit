name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit tests, package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Nothing on this runner launches Electron, so skip the binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package

  native:
    name: Native build, Swift tests, e2e (macOS)
    # macos-26 is arm64 with Xcode 26.6 as the default Xcode (runner-images README, 2026-10-13).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swiftc --version

      - name: Require the macOS 26 SDK
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::macOS SDK $sdk found, but 26 or newer is required (select Xcode 26+ with xcode-select)"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Electron's binary is not always fetched by the install lifecycle; this is a no-op when present.
      - name: Fetch Electron binary
        run: node node_modules/electron/install.js

      - name: Build native addon (arm64 and x64)
        run: pnpm build:native --arch arm64,x64

      - run: pnpm test:swift

      - run: pnpm build

      - name: End-to-end tests
        timeout-minutes: 15
        run: pnpm test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilds
          path: prebuilds/
          if-no-files-found: error
          retention-days: 14
