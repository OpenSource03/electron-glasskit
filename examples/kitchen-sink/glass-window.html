<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Glass window</title>
    <style>
      html, body { height: 100%; margin: 0; background: transparent; }
      body { display: grid; place-items: center; font: 600 22px -apple-system, sans-serif; color: CanvasText; -webkit-app-region: drag; }
      p { margin: 0; text-align: center; }
      small { display: block; margin-top: 8px; font-weight: 400; font-size: 13px; opacity: 0.7; }
      :root { color-scheme: light dark; }
    </style>
  </head>
  <body>
    <p>
      This whole window is glass
      <small>Drag it over something colourful.</small>
    </p>
  </body>
</html>
